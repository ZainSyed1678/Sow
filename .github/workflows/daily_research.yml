name: Daily AI/ML Research & Publication

on:
  schedule:
    # 01:30 UTC = 7:00 AM IST (Indian Standard Time, UTC+5:30)
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not write to Notion)'
        required: false
        type: boolean
        default: false
      topic:
        description: 'Research topic override (e.g. ai_ml, robotics, quantum_ml)'
        required: false
        type: string
        default: 'ai_ml'
      custom_url:
        description: 'Custom URL to synthesize directly (leave empty for automated collection)'
        required: false
        type: string
        default: ''
      custom_title:
        description: 'Custom title for the input URL (leave empty for automated collection)'
        required: false
        type: string
        default: ''
      min_score:
        description: 'Relevance threshold (default: 0.40)'
        required: false
        type: string
        default: '0.40'
      concept:
        description: 'Direct topic/concept to generate (no research paper needed, e.g. Mixture of Experts)'
        required: false
        type: string
        default: ''

jobs:
  research-and-publish:
    name: Collect, Synthesize, and Publish
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Local SQLite State
        uses: actions/cache@v4
        with:
          path: local_state/
          key: researcher-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            researcher-state-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Validate GitHub Secrets (Live Mode)
        env:
          IS_DRY_RUN: ${{ github.event.inputs.dry_run }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          DB_DAILY: ${{ secrets.NOTION_DATABASE_ID_DAILY_BRIEFINGS }}
          DB_CONCEPT: ${{ secrets.NOTION_DATABASE_ID_CONCEPT_LIBRARY }}
          DB_PAPERS: ${{ secrets.NOTION_DATABASE_ID_RESEARCH_PAPERS }}
          DB_TOOLS: ${{ secrets.NOTION_DATABASE_ID_TOOLS_FRAMEWORKS }}
          DB_WEEKLY: ${{ secrets.NOTION_DATABASE_ID_WEEKLY_REVIEWS }}
        run: |
          if [ "$IS_DRY_RUN" != "true" ]; then
            MISSING=""
            [ -z "$GROQ_API_KEY" ] && MISSING="$MISSING GROQ_API_KEY"
            [ -z "$NOTION_API_KEY" ] && MISSING="$MISSING NOTION_API_KEY"
            [ -z "$DB_DAILY" ] && MISSING="$MISSING NOTION_DATABASE_ID_DAILY_BRIEFINGS"
            [ -z "$DB_CONCEPT" ] && MISSING="$MISSING NOTION_DATABASE_ID_CONCEPT_LIBRARY"
            [ -z "$DB_PAPERS" ] && MISSING="$MISSING NOTION_DATABASE_ID_RESEARCH_PAPERS"
            [ -z "$DB_TOOLS" ] && MISSING="$MISSING NOTION_DATABASE_ID_TOOLS_FRAMEWORKS"
            [ -z "$DB_WEEKLY" ] && MISSING="$MISSING NOTION_DATABASE_ID_WEEKLY_REVIEWS"
            if [ -n "$MISSING" ]; then
              echo "::error::Missing required repository secrets: $MISSING"
              echo "Please navigate to: Repo Settings -> Secrets and variables -> Actions and add these secrets."
              exit 1
            fi
          fi

      - name: Run Daily Research Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID_DAILY_BRIEFINGS: ${{ secrets.NOTION_DATABASE_ID_DAILY_BRIEFINGS }}
          NOTION_DATABASE_ID_CONCEPT_LIBRARY: ${{ secrets.NOTION_DATABASE_ID_CONCEPT_LIBRARY }}
          NOTION_DATABASE_ID_RESEARCH_PAPERS: ${{ secrets.NOTION_DATABASE_ID_RESEARCH_PAPERS }}
          NOTION_DATABASE_ID_TOOLS_FRAMEWORKS: ${{ secrets.NOTION_DATABASE_ID_TOOLS_FRAMEWORKS }}
          NOTION_DATABASE_ID_WEEKLY_REVIEWS: ${{ secrets.NOTION_DATABASE_ID_WEEKLY_REVIEWS }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          LOG_LEVEL: "INFO"
        run: |
          CMD_ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            CMD_ARGS="--dry-run"
          else
            CMD_ARGS="--live"
          fi

          if [ -n "${{ github.event.inputs.topic }}" ]; then
            CMD_ARGS="$CMD_ARGS --topic '${{ github.event.inputs.topic }}'"
          fi

          if [ -n "${{ github.event.inputs.min_score }}" ]; then
            CMD_ARGS="$CMD_ARGS --min-score ${{ github.event.inputs.min_score }}"
          fi

          if [ -n "${{ github.event.inputs.custom_url }}" ]; then
            CMD_ARGS="$CMD_ARGS --custom-url '${{ github.event.inputs.custom_url }}'"
          fi

          if [ -n "${{ github.event.inputs.custom_title }}" ]; then
            CMD_ARGS="$CMD_ARGS --custom-title '${{ github.event.inputs.custom_title }}'"
          fi

          if [ -n "${{ github.event.inputs.concept }}" ]; then
            CMD_ARGS="$CMD_ARGS --concept '${{ github.event.inputs.concept }}'"
          fi

          echo "Executing: python -m ai_ml_notion_researcher.main $CMD_ARGS"
          python -m ai_ml_notion_researcher.main $CMD_ARGS

name: Weekly AI/ML Synthesis Review

on:
  schedule:
    # Sunday at 01:30 UTC = 7:00 AM IST
    - cron: '30 1 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run in dry-run mode (do not write to Notion)'
        required: false
        type: boolean
        default: false

jobs:
  weekly-synthesis:
    name: Generate and Publish Weekly Synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Local SQLite State
        uses: actions/cache@v4
        with:
          path: local_state/
          key: researcher-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            researcher-state-${{ runner.os }}-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Weekly Synthesis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "openai/gpt-oss-120b"
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID_DAILY_BRIEFINGS: ${{ secrets.NOTION_DATABASE_ID_DAILY_BRIEFINGS }}
          NOTION_DATABASE_ID_CONCEPT_LIBRARY: ${{ secrets.NOTION_DATABASE_ID_CONCEPT_LIBRARY }}
          NOTION_DATABASE_ID_RESEARCH_PAPERS: ${{ secrets.NOTION_DATABASE_ID_RESEARCH_PAPERS }}
          NOTION_DATABASE_ID_TOOLS_FRAMEWORKS: ${{ secrets.NOTION_DATABASE_ID_TOOLS_FRAMEWORKS }}
          NOTION_DATABASE_ID_WEEKLY_REVIEWS: ${{ secrets.NOTION_DATABASE_ID_WEEKLY_REVIEWS }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python -m ai_ml_notion_researcher.main --weekly --dry-run
          else
            python -m ai_ml_notion_researcher.main --weekly --live
          fi
